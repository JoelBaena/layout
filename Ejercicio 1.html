<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RobotWeb</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        img {
            width: 60px;
            display: block;
            margin: 10px 0;
        }
        .header {
            display: flex;
            justify-content: space-between; /* Coloca elementos en los extremos */
            align-items: center; /* Alinea verticalmente */
            padding: 10px 20px; /* Añade espacio interno */
        }

        .images {
            position: absolute;
            top: 100px;
            left: 10px;
        }
        .content {
            background-color: gray;
            color: black;
            text-align: center;
            padding: 50px 0;
            font-size: 20px;
            margin-top: 325px; /* Añadir margen superior para que no cubra las imágenes */
        }
    </style>
</head>
<body>
    <!-- Cabecera -->
    <div class="header">
        <span style="font-size: 30px;">🤖</span>
        <h1 style="display: inline-block; margin: 0;">RobotWeb</h1>
        <span style="font-size: 30px;">🔎</span>
    </div>

    <!-- Imágenes -->
    <div class="images">
        <img src="https://gerardfp.github.io/htmllayout/img/1.webp" alt="Character 1">
        <img src="https://gerardfp.github.io/htmllayout/img/2.webp" alt="Character 2">
        <img src="https://gerardfp.github.io/htmllayout/img/3.webp" alt="Character 3">
        <img src="https://gerardfp.github.io/htmllayout/img/4.webp" alt="Character 4">
    </div>

    <!-- Contenido principal -->
    <div class="content">
        <p>Welcome to RobotWeb</p>
    </div>
</body>
</html>
